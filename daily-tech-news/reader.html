<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f5f3">
  <title>每日科技新闻简报</title>
  <link rel="stylesheet" href="../assets/site-shell.css">
</head>
<body class="ss-page">
  <header class="ss-site-header"><nav class="ss-site-nav ss-shell" aria-label="主导航"><a class="ss-brand" href="index.html"><span class="ss-brand-mark" aria-hidden="true"></span><span>Tech News</span></a><div class="ss-nav-links"><a href="index.html" aria-current="page">返回简报目录</a><a href="../">Home</a></div></nav></header>
  <main class="ss-reader-wrap"><article class="ss-reader" id="content" aria-live="polite">加载中...</article></main>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    const date = new URLSearchParams(location.search).get('date');
    const content = document.getElementById('content');
    if (!date || !/^\d{4}-\d{2}-\d{2}$/.test(date)) {
      content.textContent = '缺少有效日期。';
    } else {
      const localUrl = `briefs/${date}.md`;
      const rawUrl = `https://raw.githubusercontent.com/chenmzh/chenmzh.github.io-repository/master/daily-tech-news/briefs/${date}.md`;
      fetch(localUrl).then(r => r.ok ? r.text() : fetch(rawUrl).then(fallback => {
        if (!fallback.ok) throw new Error('not found');
        return fallback.text();
      })).then(md => {
        document.title = `每日科技新闻简报｜${date}`;
        content.innerHTML = marked.parse(md);
      }).catch(() => { content.textContent = '没有找到这一天的简报 Markdown。'; });
    }
  </script>
</body>
</html>
