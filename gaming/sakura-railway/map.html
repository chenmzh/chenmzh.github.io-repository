  <meta name="description" content="春日水乡小镇 — 在白墙黛瓦、石桥河埠与田野之间，乘着列车探索有生活气息的江南微缩世界。" />

<body class="map-page">
  <canvas id="stage" tabindex="0" aria-label="列车穿行于江南水乡、学校、医院与田野之间的体素微缩小镇。可用拖拽、键盘和触摸自由探索。"></canvas>

  <!-- whisper text, bottom-left. never a UI. -->
  <div id="whisper" aria-hidden="true">小桥流水，烟火人间。</div>

  <!-- operation hint, fades away after a while -->
  <div id="map-hint" role="status">
    <span class="hint-pc">拖拽环顾 · WASD移动 · 滚轮缩放 · Q/E调整时间</span>
    <span class="hint-touch">单指环顾 · 双指移动 · 捏合缩放</span>
  </div>

  <!-- sound only after the visitor chooses it -->
  <button id="sound" type="button" aria-label="开启环境音" aria-pressed="false">声音</button>
  <button id="reset-view" type="button" aria-label="回到初始视点">重置视点</button>

  <!-- manual quality tier -->
  <button id="quality" type="button" aria-label="切换画质">画质</button>

  <!-- back to the film -->
  <a id="mode-link" href="./index.html">进入电影模式 →</a>

</body>
</html>
