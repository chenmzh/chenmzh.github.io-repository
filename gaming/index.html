    h2{font-family:Didot,Georgia,serif;font-size:38px;font-weight:400;margin:0 0 12px}p{color:#9da59f;line-height:1.6}a{align-self:end;display:flex;justify-content:space-between;padding:18px;background:#5ff6e3;color:#07100e;text-decoration:none;font-weight:900;letter-spacing:.12em}

</head>
