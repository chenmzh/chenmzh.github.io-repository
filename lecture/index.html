<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Mingzhe Chen 的公开课程讲义目录">
  <meta name="theme-color" content="#eef4fb">
  <title>Lecture Archive</title>
  <link rel="stylesheet" href="../assets/site-shell.css">
  <style>
    :root {
      color-scheme: light;
      --paper: #eef4fb;
      --surface: #ffffff;
      --ink: #1e2f42;
      --muted: #5c6f84;
      --faint: #8496aa;
      --line: #dbe6f2;
      --accent: #2f6fb4;
      --accent-soft: #e3eef9;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: "Avenir Next", Avenir, "Noto Sans SC", "PingFang SC", "Helvetica Neue", sans-serif;
      letter-spacing: 0;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(860px, calc(100% - 32px));
      margin: 0 auto;
      padding: 64px 0 80px;
    }

    header {
      padding-bottom: 24px;
      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 3.7rem);
      font-weight: 600;
      line-height: 1.05;
      letter-spacing: -0.02em;
    }

    .intro {
      max-width: 600px;
      margin: 14px 0 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .course-list {
      margin-top: 36px;
      border-top: 1px solid var(--line);
    }

    .course {
      display: grid;
      grid-template-columns: 88px minmax(0, 1fr) auto;
      gap: 20px;
      align-items: center;
      min-height: 112px;
      padding: 20px 8px;
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid var(--line);
      transition: background-color 160ms ease;
    }

    .course:hover { background: var(--surface); }

    .course:hover .course-title,
    .course:focus-visible .course-title { color: var(--accent); }

    .course:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 6px;
    }

    .course-code {
      color: var(--faint);
      font-size: 0.82rem;
      font-weight: 600;
    }

    .course-title {
      display: block;
      margin-bottom: 7px;
      font-size: 1.15rem;
      font-weight: 600;
    }

    .course-meta {
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.55;
    }

    .arrow {
      color: var(--accent);
      font-size: 1.45rem;
    }

    @media (max-width: 560px) {
      main { padding-top: 40px; }
      .course { grid-template-columns: 1fr auto; gap: 8px 16px; }
      .course-code { grid-column: 1 / -1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .course { transition: none; }
    }
  </style>
</head>
<body>
  <nav class="ss-backbar" aria-label="站点导航"><div class="ss-backbar-inner"><a class="ss-back" href="../">← 返回上一级</a><span class="ss-crumb">Lecture Archive</span></div></nav>
  <main>
    <header>
      <p class="eyebrow">Open course notes</p>
      <h1>Lecture Archive</h1>
      <p class="intro">公开课程讲义、公式推导、例题答案与本地交互演示。</p>
    </header>

    <section class="course-list" aria-label="课程列表">
      <a class="course" href="./iml26/">
        <span class="course-code">IML 2026</span>
        <span>
          <span class="course-title">Introduction to Machine Learning</span>
          <span class="course-meta">第 1-10 讲中文详解，含 LaTeX 公式、Matplotlib 可视化与交互实验</span>
        </span>
        <span class="arrow" aria-hidden="true">&#8594;</span>
      </a>
    </section>
  </main>
</body>
</html>
