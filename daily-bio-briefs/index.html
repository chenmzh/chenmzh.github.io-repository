<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>每日合成与发育生物学简报</title>
  <link rel="stylesheet" href="../assets/site-shell.css">
  <style>
    body { margin:0; font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#17202a; background:#f7f8fb; }
    main { max-width:1080px; margin:0 auto; padding:28px 18px 48px; }
    h1 { margin:0 0 14px; font-size:32px; line-height:1.15; }
    .controls { display:grid; grid-template-columns:1fr 180px 180px; gap:12px; margin:20px 0; }
    input, select { font:inherit; padding:10px 12px; border:1px solid #cfd6e2; border-radius:6px; background:#fff; }
    .grid { display:grid; gap:12px; }
    .card { display:block; text-decoration:none; color:inherit; background:#fff; border:1px solid #d8dee8; border-radius:8px; padding:16px; }
    .meta { color:#667085; font-size:14px; margin-bottom:6px; }
    .tags { color:#335c81; font-size:14px; margin-top:8px; }
    @media (max-width:900px) { .controls { grid-template-columns:1fr 1fr; } }
    @media (max-width:700px) { .controls { grid-template-columns:1fr; } h1 { font-size:26px; } }
  </style>
</head>
<body>
<header class="ss-site-header">
  <nav class="ss-site-nav ss-shell" aria-label="主导航">
    <a class="ss-brand" href="../" aria-label="返回 Mingzhe Chen 首页"><span class="ss-brand-mark" aria-hidden="true"></span><span>Mingzhe Chen</span></a>
    <div class="ss-nav-links"><a href="./" aria-current="page">Briefs</a><a href="../lecture/">Learning</a><a href="../gaming/">Play</a><a href="../music/">Music</a><a href="../tools/">Tools</a></div>
  </nav>
</header>
<main>
  <h1>每日合成与发育生物学简报</h1>
  <div class="controls">
    <input id="q" type="search" placeholder="搜索日期、标题、摘要、条目或标签">
    <select id="date"><option value="">全部日期</option></select>
    <select id="topic"><option value="">全部主题</option></select>
  </div>
  <div id="list" class="grid"></div>
</main>
<script>
const q = document.getElementById('q');
const date = document.getElementById('date');
const topic = document.getElementById('topic');
const list = document.getElementById('list');
let briefs = [];
function esc(s) { return (s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function searchable(b) { return [b.date,b.title,b.summary,(b.articles||b.items||[]).join(' '),(b.topics||b.tags||[]).join(' ')].join(' ').toLowerCase(); }
function render() {
  const needle = q.value.trim().toLowerCase();
  const selectedDate = date.value;
  const selectedTopic = topic.value;
  const rows = briefs.filter(b => (!needle || searchable(b).includes(needle)) && (!selectedDate || b.date === selectedDate) && (!selectedTopic || (b.topics||b.tags||[]).includes(selectedTopic)));
  list.innerHTML = rows.map(b => `<a class="card" href="${esc(b.url)}">
    <div class="meta">${esc(b.date)}</div>
    <strong>${esc(b.title)}</strong>
    <p>${esc(b.summary || '')}</p>
    <div class="tags">${(b.topics || b.tags || []).map(esc).join(' / ')}</div>
  </a>`).join('') || '<p>没有匹配结果。</p>';
}
fetch('search.json').then(r => r.json()).then(data => {
  briefs = data.briefs || [];
  date.innerHTML += briefs.map(b => `<option value="${esc(b.date)}">${esc(b.date)}</option>`).join('');
  const topics = [...new Set(briefs.flatMap(b => b.topics || b.tags || []))].sort();
  topic.innerHTML += topics.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('');
  render();
});
q.addEventListener('input', render);
date.addEventListener('change', render);
topic.addEventListener('change', render);
</script>
</body>
</html>
