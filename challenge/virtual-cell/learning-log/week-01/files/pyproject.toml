[project]
name = "virtual-cell-week01"
version = "0.1.0"
description = "Bilingual Week 1 learning environment for the Virtual Cell Challenge"
requires-python = ">=3.11,<3.13"
dependencies = [
  "anndata>=0.11,<0.13",
  "scanpy>=1.10,<1.13",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2",
  "matplotlib>=3.8,<4",
  "jupyterlab>=4,<5",
  "ipykernel>=6,<8",
  "cell-eval2>=0.16,<1",
  "pytest>=8,<10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
