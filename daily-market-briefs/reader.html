<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f5f3">
  <title>每日股票市场简报</title>
  <link rel="stylesheet" href="../assets/site-shell.css">
</head>
<body class="ss-page">
  <header class="ss-site-header"><nav class="ss-site-nav ss-shell" aria-label="主导航"><a class="ss-brand" href="index.html"><span class="ss-brand-mark" aria-hidden="true"></span><span>Market Briefs</span></a><div class="ss-nav-links"><a href="index.html" aria-current="page">返回简报目录</a><a href="../#briefs">Briefs</a><a href="../lecture/">Learning</a><a href="../gaming/">Play</a><a href="../music/">Music</a><a href="../tools/">Tools</a></div></nav></header>
  <main class="ss-reader-wrap"><article class="ss-reader" id="content" aria-live="polite">加载中...</article></main>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    const date = new URLSearchParams(location.search).get('date');
    const content = document.getElementById('content');
    function escapeHtml(s){ return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function renderFallback(){
      fetch('search.json').then(r => r.json()).then(data => {
        const b = (data.briefs || []).find(x => x.date === date);
        if (!b) throw new Error('not indexed');
        document.title = b.title;
        const tags = [...(b.markets || []), ...(b.tickers || [])];
        content.innerHTML = `<h1>${escapeHtml(b.title)}</h1><p class="ss-note">该日期的完整 Markdown 尚未回填到 GitHub；下面先显示检索索引中的摘要、标签和观察名单。</p><h2>标签</h2><p>${tags.map(escapeHtml).join(' / ')}</p><h2>摘要</h2><p>${escapeHtml(b.summary)}</p><h2>观察名单 / 重点</h2><ol>${(b.items || []).map(a => `<li>${escapeHtml(a)}</li>`).join('')}</ol>`;
      }).catch(() => { content.textContent = '没有找到这一天的简报。'; });
    }
    if (!date || !/^\d{4}-\d{2}-\d{2}$/.test(date)) {
      content.textContent = '缺少有效日期。';
    } else {
      fetch(`https://raw.githubusercontent.com/chenmzh/chenmzh.github.io-repository/master/daily-market-briefs/briefs/${date}.md`).then(r => { if (!r.ok) throw new Error('not found'); return r.text(); }).then(md => {
        document.title = `每日股票市场简报｜${date}`;
        content.innerHTML = marked.parse(md);
      }).catch(renderFallback);
    }
  </script>
</body>
</html>
